<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Vedant</title>
<meta name="description" content="Tap a mood and the tubelight in Vedant's room pulses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one left-aligned column, three glow cards stacked, matching the TubeLight menu bar panel. */
:root {
  --panel: #1b1c21;
  --card: #131418;
  --ink: #f6f1e8;
  --muted: #9ea0ad;
  --hairline: rgba(255,255,255,.08);
  --nudge: #4d5dff;
  --urgent: #ff5a5a;
  --call: #b05cff;
  --ok: #5ccc80;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--panel); color: var(--ink); }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
main { max-width: 440px; display: grid; gap: 20px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
.sub { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
label { display: grid; gap: 6px; font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input {
  font: 500 16px var(--body); color: var(--ink); background: var(--card);
  border: 1px solid var(--hairline); border-radius: 14px; padding: 12px 14px; width: 100%;
}
input:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
.moods { display: grid; gap: 12px; }
.mood {
  position: relative; overflow: hidden; text-align: left; width: 100%;
  border: 1px solid var(--hairline); border-radius: 20px; background: var(--card); color: var(--ink);
  padding: 18px 18px 56px; cursor: pointer; font: inherit;
  transition: transform .12s ease;
}
.mood:active { transform: scale(.985); }
.mood:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mood::before {
  content: ""; position: absolute; inset: -24px; pointer-events: none;
  background:
    radial-gradient(60% 55% at 50% 118%, rgba(255,255,255,.75), transparent 70%),
    radial-gradient(90% 80% at 50% 115%, var(--c), transparent 72%),
    linear-gradient(to bottom, transparent 25%, color-mix(in srgb, var(--c) 35%, transparent) 60%, color-mix(in srgb, var(--c) 90%, transparent));
  filter: blur(14px); opacity: .55; transition: opacity .25s ease;
}
.mood:hover::before, .mood.sent::before { opacity: 1; }
.mood > * { position: relative; }
.mood .name { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; display: block; }
.mood .chip {
  display: inline-block; margin-top: 10px; padding: 4px 9px; border-radius: 999px;
  font: 600 12px var(--body); letter-spacing: .02em;
  color: color-mix(in srgb, var(--c) 55%, white); background: color-mix(in srgb, var(--c) 20%, transparent);
}
.mood[data-mood="nudge"]  { --c: var(--nudge); }
.mood[data-mood="urgent"] { --c: var(--urgent); }
.mood[data-mood="call"]   { --c: var(--call); }
.mood:disabled { opacity: .5; cursor: default; }
.pick { padding: 18px 18px 48px; cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; }
.pick::before { opacity: 1; }
.pick .hint { position: absolute; right: 16px; bottom: 14px; font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: rgba(246,241,232,.5); }
.set {
  width: 100%; margin-top: 12px; padding: 14px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--hairline); background: var(--card); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .04em; text-transform: uppercase;
}
.set:active { transform: scale(.985); }
.set:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.set:disabled { opacity: .5; cursor: default; }
.set b { color: var(--pc, var(--ink)); font-weight: 800; }
.status { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 22px; }
.status.ok { color: var(--ok); }
.status.err { color: var(--urgent); }
.foot { font-size: 14px; color: var(--muted); }
.foot code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .mood, .mood::before { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Signal Vedant</h1>
    <p class="sub">Tap a mood. The tubelight in his room pulses.</p>
  </header>

  <section id="missing" hidden>
    <p class="foot">This link is missing its key. Ask Vedant for the full link; it ends with <code>#tubelight-…</code>.</p>
  </section>

  <section id="form" hidden>
    <label>Your name
      <input id="name" type="text" maxlength="40" autocomplete="name" placeholder="So he knows who it is">
    </label>
    <div class="moods" style="margin-top:20px">
      <button class="mood" data-mood="nudge" type="button"><span class="name">Nudge</span><span class="chip">three slow blue pulses</span></button>
      <button class="mood" data-mood="urgent" type="button"><span class="name">Urgent</span><span class="chip">six fast red flashes</span></button>
      <button class="mood" data-mood="call" type="button"><span class="name">Call me</span><span class="chip">four purple pulses</span></button>
    </div>
    <label style="margin-top:24px; display:block">Or set his light to a colour</label>
    <div class="mood pick" id="pick" role="slider" aria-label="Colour" aria-valuemin="0" aria-valuemax="359" aria-valuenow="240" tabindex="0" style="--c:#0000ff; margin-top:6px">
      <span class="name" id="pickName">Blue</span>
      <span class="chip" id="pickHex">#0000FF</span>
      <span class="hint">Drag across for colour</span>
    </div>
    <button class="set" id="setBtn" type="button">Set his light to <b id="setName">Blue</b></button>
    <label style="margin-top:20px">Note, optional
      <input id="note" type="text" maxlength="140" placeholder="Shows on his Mac next to the signal">
    </label>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="foot">One signal every ten seconds reaches the light. If the light is off the grid, the signal still shows on his Mac.</p>
  </section>
</main>
<script>
(function () {
  var topic = (location.hash || "").replace(/^#/, "");
  var form = document.getElementById("form"), missing = document.getElementById("missing");
  if (!/^tubelight-[A-Za-z0-9]{8,}$/.test(topic)) { missing.hidden = false; return; }
  form.hidden = false;
  var name = document.getElementById("name"), note = document.getElementById("note"), status = document.getElementById("status");
  try { name.value = localStorage.getItem("signal.name") || ""; } catch (e) {}
  name.addEventListener("change", function () { try { localStorage.setItem("signal.name", name.value); } catch (e) {} });
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".mood[data-mood]"));
  var setBtn = document.getElementById("setBtn");
  var all = buttons.concat([setBtn]);
  var words = { nudge: "Sent. Three blue pulses in his room.", urgent: "Sent. Red flashes in his room.", call: "Sent. Purple pulses, he should call." };

  function send(payload, okText, flash) {
    all.forEach(function (x) { x.disabled = true; });
    status.className = "status"; status.textContent = "Sending";
    payload.from = name.value.trim(); payload.note = note.value.trim();
    fetch("https://ntfy.sh/", {
      method: "POST",
      body: JSON.stringify({ topic: topic, title: "Signal from " + (payload.from || "a friend"), message: JSON.stringify(payload), tags: ["bulb"] })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      status.className = "status ok"; status.textContent = okText;
      if (flash) { flash.classList.add("sent"); setTimeout(function () { flash.classList.remove("sent"); }, 1500); }
      note.value = "";
    }).catch(function () {
      status.className = "status err"; status.textContent = "Could not send. Check your connection and try again.";
    }).finally(function () {
      setTimeout(function () { all.forEach(function (x) { x.disabled = false; }); }, 3000);
    });
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { send({ mood: b.dataset.mood }, words[b.dataset.mood], b); });
  });

  // Colour picker: drag across the card for hue, same names and hex as his menu bar app.
  var names = [[10,"Red"],[20,"Vermilion"],[35,"Orange"],[48,"Amber"],[65,"Yellow"],[80,"Lime"],[140,"Green"],[165,"Mint"],[175,"Teal"],[195,"Cyan"],[215,"Sky"],[235,"Azure"],[250,"Blue"],[265,"Indigo"],[285,"Violet"],[300,"Purple"],[320,"Magenta"],[340,"Pink"],[354,"Rose"],[360,"Red"]];
  function hueName(h) { for (var i = 0; i < names.length; i++) if (h <= names[i][0]) return names[i][1]; return "Red"; }
  function hex(h) {
    var c = 1, x = 1 - Math.abs((h / 60) % 2 - 1), r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return "#" + [r, g, b].map(function (v) { return ("0" + Math.round(v * 255).toString(16).toUpperCase()).slice(-2); }).join("");
  }
  var pick = document.getElementById("pick"), pickName = document.getElementById("pickName"), pickHex = document.getElementById("pickHex"), setName = document.getElementById("setName");
  var hue = 240;
  function paint() {
    var col = "hsl(" + hue + " 100% 50%)";
    pick.style.setProperty("--c", col);
    setBtn.style.setProperty("--pc", "hsl(" + hue + " 100% 72%)");
    pickName.textContent = hueName(hue); setName.textContent = hueName(hue); pickHex.textContent = hex(hue);
    pick.setAttribute("aria-valuenow", hue);
  }
  function fromEvent(e) {
    var r = pick.getBoundingClientRect();
    hue = Math.round(Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * 359);
    paint();
  }
  var down = false;
  pick.addEventListener("pointerdown", function (e) { down = true; pick.setPointerCapture(e.pointerId); fromEvent(e); });
  pick.addEventListener("pointermove", function (e) { if (down) fromEvent(e); });
  pick.addEventListener("pointerup", function () { down = false; });
  pick.addEventListener("pointercancel", function () { down = false; });
  pick.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { hue = (hue + 359) % 360; paint(); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { hue = (hue + 1) % 360; paint(); e.preventDefault(); }
  });
  setBtn.addEventListener("click", function () { send({ mood: "colour", hue: hue }, "Sent. His light is going " + hueName(hue).toLowerCase() + ".", pick); });
  paint();
})();
</script>
</body>
</html>
